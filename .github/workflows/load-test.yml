name: load test (k6)

# Manual only: load tests are slow and noisy, so they are an operator tool
# rather than a per-PR gate. The inputs below render as a form when you click
# "Run workflow" in the Actions tab, and are passed straight through to the
# shared job in load-run.yml.
on:
  workflow_dispatch:
    inputs:
      vus:
        description: Virtual users (concurrent workers)
        required: false
        default: '10'
        type: string
      duration:
        description: Steady-state duration (e.g. 30s, 2m)
        required: false
        default: '30s'
        type: string
      p95_ms:
        description: Fail if the 95th-percentile response time exceeds this (ms)
        required: false
        default: '300'
        type: string

concurrency:
  group: load-test
  cancel-in-progress: false

jobs:
  k6:
    uses: ./.github/workflows/load-run.yml
    with:
      vus: ${{ inputs.vus }}
      duration: ${{ inputs.duration }}
      p95_ms: ${{ inputs.p95_ms }}
