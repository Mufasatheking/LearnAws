name: load test (k6)

# Manual only: load tests are slow and noisy, so they are an operator tool
# rather than a per-PR gate. The inputs below render as a form when you click
# "Run workflow" in the Actions tab.
on:
  workflow_dispatch:
    inputs:
      vus:
        description: Virtual users (concurrent workers)
        required: false
        default: '10'
        type: string
      duration:
        description: Steady-state duration (e.g. 30s, 2m)
        required: false
        default: '30s'
        type: string
      p95_ms:
        description: Fail if the 95th-percentile response time exceeds this (ms)
        required: false
        default: '300'
        type: string

concurrency:
  group: load-test
  cancel-in-progress: false

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t learnaws .

      - name: Start API
        run: |
          docker run -d --rm --name loadtarget -p 8080:8080 learnaws
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/api/person > /dev/null && break
            sleep 0.5
          done
          curl -sf http://localhost:8080/api/person > /dev/null

      # k6 runs from its own container so nothing needs installing on the
      # runner. --network host lets it reach the API's published port.
      - name: Run k6
        env:
          VUS: ${{ inputs.vus }}
          DURATION: ${{ inputs.duration }}
          P95_MS: ${{ inputs.p95_ms }}
        run: |
          docker run --rm --network host \
            -e BASE_URL=http://localhost:8080 \
            -e VUS="$VUS" \
            -e DURATION="$DURATION" \
            -e P95_MS="$P95_MS" \
            -v "$PWD/load-tests:/scripts" \
            grafana/k6:1.3.0 run /scripts/person-api.js \
            --summary-export=/scripts/summary.json

      # Dispatch inputs are user-controlled, so they never go straight into a
      # run block: interpolation happens before the shell sees the script, so
      # a crafted value would execute. Passing them as env vars keeps them data.
      - name: Summarise results
        if: always()
        env:
          VUS: ${{ inputs.vus }}
          DURATION: ${{ inputs.duration }}
          P95_MS: ${{ inputs.p95_ms }}
        run: |
          {
            echo "### k6 load test"
            echo ""
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| VUs | $VUS |"
            echo "| Steady-state duration | $DURATION |"
            echo "| p95 budget (ms) | $P95_MS |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: load-tests/summary.json
          retention-days: 7
          if-no-files-found: warn

      - name: API logs on failure
        if: failure()
        run: docker logs loadtarget 2>&1 || echo "container not running"

      - name: Stop API
        if: always()
        run: docker stop loadtarget || true
