name: load run (k6)

# Reusable: holds the k6 job body shared by load-test.yml (manual,
# parameterised) and load-smoke.yml (per-PR, fixed profile). workflow_call
# makes it callable but not triggerable - it has no trigger of its own, so
# it never appears as something you can run from the Actions tab.
on:
  workflow_call:
    inputs:
      vus:
        description: Virtual users (concurrent workers)
        required: false
        default: '10'
        type: string
      duration:
        description: Steady-state duration (e.g. 30s, 2m)
        required: false
        default: '30s'
        type: string
      ramp_up:
        description: Time spent climbing to the target VUs
        required: false
        default: '10s'
        type: string
      ramp_down:
        description: Time spent draining to zero VUs
        required: false
        default: '5s'
        type: string
      p95_ms:
        description: Fail if the 95th-percentile response time exceeds this (ms)
        required: false
        default: '300'
        type: string
      container_name:
        description: Name for the API container under test
        required: false
        default: loadtarget
        type: string
      artifact_name:
        description: Name of the uploaded k6 summary artifact
        required: false
        default: k6-summary
        type: string
      summary_title:
        description: Heading for the step-summary table
        required: false
        default: k6 load test
        type: string
      timeout_minutes:
        description: Job timeout
        required: false
        default: 20
        type: number

jobs:
  k6-run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # Every input lands here first, so no run block interpolates ${{ }}:
    # inputs are caller-controlled data and must never become shell source.
    env:
      VUS: ${{ inputs.vus }}
      DURATION: ${{ inputs.duration }}
      RAMP_UP: ${{ inputs.ramp_up }}
      RAMP_DOWN: ${{ inputs.ramp_down }}
      P95_MS: ${{ inputs.p95_ms }}
      CONTAINER: ${{ inputs.container_name }}
      TITLE: ${{ inputs.summary_title }}
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t learnaws .

      - name: Start API
        run: |
          docker run -d --rm --name "$CONTAINER" -p 8080:8080 learnaws
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/api/person > /dev/null && break
            sleep 0.5
          done
          curl -sf http://localhost:8080/api/person > /dev/null

      # k6 runs from its own container so nothing needs installing on the
      # runner. --network host lets it reach the API's published port, and
      # --user makes it write summary.json as the runner rather than as the
      # image's uid 12345, which cannot write into the checked-out tree.
      - name: Run k6
        run: |
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -e BASE_URL=http://localhost:8080 \
            -e VUS \
            -e DURATION \
            -e RAMP_UP \
            -e RAMP_DOWN \
            -e P95_MS \
            -v "$PWD/load-tests:/scripts" \
            grafana/k6:1.3.0 run /scripts/person-api.js \
            --summary-export=/scripts/summary.json

      - name: Summarise results
        if: always()
        run: |
          {
            echo "### $TITLE"
            echo ""
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| VUs | $VUS |"
            echo "| Steady-state duration | $DURATION |"
            echo "| p95 budget (ms) | $P95_MS |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: load-tests/summary.json
          retention-days: 7
          if-no-files-found: error

      - name: API logs on failure
        if: failure()
        run: docker logs "$CONTAINER" 2>&1 || echo "container not running"

      - name: Stop API
        if: always()
        run: docker stop "$CONTAINER" || true
