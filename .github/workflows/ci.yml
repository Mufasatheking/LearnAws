name: first-ci-dotnet-build-and-test

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write      # test-reporter creates a check run; the default token is read-only for checks
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dotnet-cached

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test --configuration Release --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451 # v2
        with:
          name: dotnet tests
          path: TestResults/results.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/results.trx
          retention-days: 7

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Fail on vulnerable packages
        run: |
          output=$(dotnet list package --vulnerable --include-transitive)
          echo "$output"
          if echo "$output" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable packages found - see log above."
            exit 1
          fi
          echo "OK: no vulnerable packages."

      - name: Lint workflow files (actionlint)
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color

      # Demo of the three output tiers a step can use.
      - name: Output tiers demo
        if: always()
        run: |
          # Tier 1: plain stdout - the Console.WriteLine of Actions.
          echo "tier 1: this is just a log line"

          # Tier 2: workflow commands - stdout with a magic prefix that the log
          # parser interprets. Annotations do NOT affect pass/fail; the exit code
          # does (see the guard job, where ::error:: accompanies an exit 1).
          echo "::notice::tier 2: a notice annotation, no file attached"
          echo "::warning file=LearnAws/Program.cs,line=9::tier 2: a warning pinned to a file and line"

          echo "::group::tier 2: a collapsed log section"
          echo "  hidden until you expand the group in the log"
          echo "  useful for noisy output like dependency trees"
          echo "::endgroup::"

          # ::add-mask:: registers a value for redaction from here on.
          FAKE_TOKEN="banana-123"
          echo "::add-mask::$FAKE_TOKEN"
          echo "tier 2: masked value follows -> $FAKE_TOKEN"

          # Tier 3: step summary - append markdown to the file named by the
          # env var; it renders on the run's summary page.
          {
            echo "### Output tiers demo"
            echo ""
            echo "| Tier | Mechanism | Where it shows |"
            echo "| --- | --- | --- |"
            echo "| 1 | \`echo\` | step log |"
            echo "| 2 | \`::command::\` | annotations / log groups |"
            echo "| 3 | \`\$GITHUB_STEP_SUMMARY\` | this table, on the run page |"
            echo "| 4 | \`Mustafa\` | Whereever he pleases |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Log colour is not an annotation - it is plain ANSI escape codes, the
      # same ones any terminal understands. \033[38;5;<n>m picks a 256-colour
      # foreground; \033[0m resets it. Annotations only come in three flavours
      # (notice/warning/error) and their colour is not yours to choose.
      - name: Rainbow log demo
        if: always()
        run: |
          printf '\033[38;5;196mred\033[0m\n'
          printf '\033[38;5;208morange\033[0m\n'
          printf '\033[38;5;226myellow\033[0m\n'
          printf '\033[38;5;46mgreen\033[0m\n'
          printf '\033[38;5;39mblue\033[0m\n'
          printf '\033[38;5;93mindigo\033[0m\n'
          printf '\033[38;5;201mviolet\033[0m\n'
          printf '\033[1;4;38;5;226mbold underlined yellow\033[0m\n'
          printf '\033[48;5;196;38;5;226myellow on red background\033[0m\n'
          # ::debug:: only appears when debug logging is enabled for the run
          # (the "Enable debug logging" checkbox on Re-run).
          echo "::debug::this line is invisible unless debug logging is on"

      # Experiment 2: secret redaction and its limits
      - name: Print tokens from shell
        env:
          LEARNAWS_EXAMPLE_TOKEN: hello-from-ci
          LEARNAWS_SECRET_TOKEN: ${{ secrets.LEARNAWS_SECRET_TOKEN }}
        run: |
          echo "example token: $LEARNAWS_EXAMPLE_TOKEN"
          echo "secret token:  $LEARNAWS_SECRET_TOKEN"
          echo "redaction bypass: ${LEARNAWS_SECRET_TOKEN:0:3}--${LEARNAWS_SECRET_TOKEN:3}"
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dotnet-cached

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Lint workflow files (actionlint)
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color

  docker-build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t learnaws .

      - name: Smoke test
        env:
          LEARNAWS_EXAMPLE_TOKEN: hello-from-docker-ci
          LEARNAWS_SECRET_TOKEN: ${{ secrets.LEARNAWS_SECRET_TOKEN }}
        run: |
          docker run -d --rm --name smoke -p 8080:8080 \
            -e LEARNAWS_EXAMPLE_TOKEN \
            -e LEARNAWS_SECRET_TOKEN \
            learnaws

          for _ in $(seq 1 20); do
            curl -sf http://localhost:8080/api/person > /dev/null && break
            sleep 0.5
          done

          curl -sf http://localhost:8080/api/person | grep -q "Alice"
          echo "Smoke test passed."

      - name: Dump container logs on failure
        if: failure()
        run: docker logs smoke 2>&1 || echo "container not running"

      - name: Stop container
        if: always()
        run: docker stop smoke || true

  # Policy guard: Console.WriteLine belongs only in Program.cs (use a logger
  # elsewhere). A guard is just a grep with an exit code: findings -> red check.
  # This file is excluded via pathspec; it necessarily names the banned pattern.
  no-console-writeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Ban Console.WriteLine outside Program.cs
        run: |
          matches=$(git grep -n "Console.WriteLine" -- '*.cs' ':!LearnAws/Program.cs' || true)
          if [ -n "$matches" ]; then
            echo "::error::Console.WriteLine found outside Program.cs - use a logger instead. Offending lines:"
            echo "$matches"
            exit 1
          fi
          echo "OK: no Console.WriteLine outside Program.cs."

  # SonarCloud: scanner observes the build + ingests Coverlet coverage, then
  # uploads to sonarcloud.io. The quality-gate verdict comes back via the
  # SonarCloud GitHub App as its own check, separate from this job's result.
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history: Sonar blames issues to commits and needs new-code detection

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: ./.github/actions/setup-dotnet-cached

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin Sonar analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"Mufasatheking_LearnAws" \
            /o:"mufasatheking" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="load-tests/**"

      - name: Build
        run: dotnet build --configuration Release

      - name: Test with coverage
        run: >
          dotnet test --configuration Release --no-build
          --collect:"XPlat Code Coverage;Format=opencover"
          --results-directory LearnAws.Tests/TestResults

      - name: End Sonar analysis (upload)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  # Aggregator: the single required check. Runs regardless of dependency
  # outcomes (if: always) so it can report failure instead of being skipped
  # and leaving the required check pending forever. Branch protection pins
  # this name only; real jobs can be added/renamed freely.
  ci-passed:
    needs: [build-and-test, build-and-lint, docker-build-and-smoke-test, no-console-writeline, sonar]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any dependency failed or was cancelled
        run: |
          test "${{ contains(needs.*.result, 'failure') }}" = "false"
          test "${{ contains(needs.*.result, 'cancelled') }}" = "false"
          echo "All CI jobs succeeded."
