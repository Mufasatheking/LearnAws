name: first-ci-dotnet-build-and-test

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build

      # Experiment 2: secret redaction and its limits
      - name: Print tokens from shell
        env:
          LEARNAWS_EXAMPLE_TOKEN: hello-from-ci
          LEARNAWS_SECRET_TOKEN: ${{ secrets.LEARNAWS_SECRET_TOKEN }}
        run: |
          echo "example token: $LEARNAWS_EXAMPLE_TOKEN"
          echo "secret token:  $LEARNAWS_SECRET_TOKEN"
          echo "redaction bypass: ${LEARNAWS_SECRET_TOKEN:0:3}--${LEARNAWS_SECRET_TOKEN:3}"

      # Experiment 1: the hang. Bare dotnet run blocks forever (web server);
      # the step timeout kills it after 1 minute and fails the job.
      - name: Smoke run (deliberately hangs)
        timeout-minutes: 1
        env:
          LEARNAWS_EXAMPLE_TOKEN: hello-from-ci
          LEARNAWS_SECRET_TOKEN: ${{ secrets.LEARNAWS_SECRET_TOKEN }}
        run: dotnet run --project LearnAws --configuration Release --no-build --urls http://localhost:8080
