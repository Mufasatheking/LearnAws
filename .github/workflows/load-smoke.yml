name: load smoke (k6)

# Runs the same k6 job as load-test.yml on every PR, with the profile fixed
# rather than prompted for: a pull_request run has no form to fill in, so the
# values are passed as literals below.
#
# Purpose is regression signal - "this got dramatically slower" - not a
# benchmark. load-test.yml stays manual for parameterised investigation.
on:
  pull_request:

concurrency:
  group: load-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k6:
    uses: ./.github/workflows/load-run.yml
    with:
      vus: '10'
      duration: 30s
      ramp_up: 3s
      ramp_down: 2s
      p95_ms: '500'   # generous: the runner is contended and shares CPU with k6
      container_name: smoketarget
      artifact_name: k6-smoke-summary
      summary_title: k6 load smoke
      timeout_minutes: 10
